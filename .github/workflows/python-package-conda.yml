name: Python Package using Conda

on:
  push:
  pull_request:
  # So the environment can be checked on demand, without waiting for a push.
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Put conda's base environment on PATH
      # The runner image ships Miniconda.  Installing into base and putting it
      # first means every later step uses that interpreter - no separate
      # setup-python, which used to shadow it with an unused 3.10.
      run: echo "${CONDA:-/usr/share/miniconda}/bin" >> "$GITHUB_PATH"
    - name: Install dependencies
      run: |
        conda env update --file environment.yml --name base
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
