name: Python Package using Conda

on:
  push:
  pull_request:
  # So the environment can be checked on demand, without waiting for a push.
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v5
    - name: Create the conda environment
      # A named environment, not the runner's base.  Updating base forces conda
      # to re-solve Anaconda's own packages (its conda-anaconda-tos plugin wants
      # Python 3.14 and fails against the 3.12 this project asks for), and
      # putting a job's tools in base is a bad habit anyway.
      run: conda env create --file environment.yml
    - name: Put the environment on PATH
      # Every later step then uses that interpreter: no setup-python, which
      # used to install an unused 3.10 that could shadow conda.
      run: echo "${CONDA:-/usr/share/miniconda}/envs/pytkquickgui/bin" >> "$GITHUB_PATH"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
